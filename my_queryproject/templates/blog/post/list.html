{% extends 'blog/base.html'%}
{%block title%}hiii{%endblock%}


{%block content%}
    <h1> hi news </h1>
    {% for post in posts %}
    <div> class="post"
        <h2>
            <a href="{{post.get_absolute_url}}">{{post.title}}</a>
        </h2>
        <p class="date">
            Published {{post.publish}} by {{post.author}}
            </p>

    </div>
    {%endfor%}
    {%include "paginator.html" with page=page_obj%}
{% endblock %}
